# Fixed consent text. Never generate or paraphrase this at request time.
# Spanish and Tagalog are not in this file. They need a native-speaking review
# before a real pilot. Counsel has not reviewed these drafts.
# Version 2 replaces the product name. A signed record keeps the version and
# the explanation_shown it stored. The archive is not served for a new request.
version: 2
facility_name: Harbor House
facility_contact: the Harbor House nurse
archive:
  1:
    position_monitoring: |
      Sorety uses an infrared camera to notice when {resident_name} changes position in bed — for example, turning from their back to their side — so caregivers know when it's time to help them reposition, to help prevent pressure injuries. What is collected: a simple outline of where {resident_name}'s body is and how it's positioned. Nothing else. What is not collected: no video or photo is ever saved, nothing is recorded with sound, no one can view the camera live. Where it can see: only the bed area, at {facility_name}. Who sees this: {resident_name}'s caregivers and nurse, only to schedule care; {facility_name}'s director and Sorety's engineers, only to confirm the system is working. Your rights: decline or revoke at any time without affecting {resident_name}'s care otherwise. Questions: {facility_contact}.
    skin_capture: |
      During a bath or care visit when a caregiver is already present, Sorety's camera may take a close, cropped photo of {resident_name}'s skin over the tailbone, hips or heels — the areas most at risk for pressure injuries. No caregiver has to take or handle a photo. What is collected: a small cropped photo of skin only, over one specific area, during care that is already happening. What is not collected: no photo of {resident_name}'s face or full body is ever taken or kept. Who sees this: encrypted, reviewed only by a nurse or clinician. Important: this is still being tested for accuracy and is not currently used to make any care decision; you will be told separately before that changes. Your rights: decline or revoke at any time without affecting {resident_name}'s care otherwise. Questions: {facility_contact}.
    continence_tracking: |
      Sorety uses bathroom-visit and care-record timing — never video — to learn when {resident_name} is likely to need a change, so caregivers can check at better times with fewer unnecessary interruptions. What is collected: times of bathroom visits and recorded changes. No images, ever. Your rights: decline or revoke at any time without affecting {resident_name}'s care otherwise. Questions: {facility_contact}.
