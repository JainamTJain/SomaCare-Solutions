services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: turnwise
      POSTGRES_PASSWORD: turnwise
      POSTGRES_DB: turnwise
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./backend/migrations/001_initial.sql:/docker-entrypoint-initdb.d/001_initial.sql:ro
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      TURNWISE_DATABASE_URL: postgresql+psycopg://turnwise:turnwise@postgres:5432/turnwise
      TURNWISE_PILOT_MODE: "1"
      TURNWISE_EDGE_TOKEN: edge-demo-token
      TURNWISE_SECRET: change-me
    ports:
      - "8000:8000"
    depends_on:
      - postgres
  cna:
    build: ./apps/cna
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
    depends_on:
      - backend
  nurse:
    build: ./apps/nurse
    ports:
      - "3001:3001"
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
    depends_on:
      - backend

volumes:
  pgdata:
