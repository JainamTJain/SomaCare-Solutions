# Render Blueprint. Dashboard equivalent:
# New Web Service, Root Directory = backend, runtime Python,
# Build: pip install -r requirements.txt
# Start: uvicorn main:app --host 0.0.0.0 --port $PORT
services:
  - type: web
    name: turnwise-api
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: "3.11"
      - key: TURNWISE_PILOT_MODE
        value: "1"
      - key: TURNWISE_EDGE_TOKEN
        sync: false
      - key: TURNWISE_SECRET
        sync: false
      # Comma-separated live front-end origins, for example
      # https://your-app.vercel.app,https://your-repl.replit.app
      - key: TURNWISE_CORS_ORIGINS
        sync: false
